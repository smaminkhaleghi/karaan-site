:root{--ink:#18222e;--muted:#667383;--line:#e2e6ec;--bg:#f4f5f7;--steel:#2f3d4f;--why:#e07a2f;--how:#4a7fe0;--what:#5b9a45}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Bonyan",Tahoma,system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom));position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;left:50%;bottom:-120px;transform:translateX(-50%);width:min(1100px,180vw);height:auto;opacity:.55}
.bg:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#ffffff 0%,rgba(255,255,255,0) 60%)}
.wrap{position:relative;z-index:1;width:100%;max-width:440px}
h1 span{white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 28px 26px;box-shadow:0 1px 2px rgba(24,34,46,.04),0 18px 40px -12px rgba(24,34,46,.14);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--what) 0 33.3%,var(--how) 33.3% 66.6%,var(--why) 66.6% 100%)}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 22px}
.brand svg{width:38px;height:24px;flex:none}
.brand b{font-weight:800;font-size:24px;line-height:1}
.brand i{font-style:normal;color:var(--muted);font-size:14px;letter-spacing:.04em;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e9edf2;color:var(--steel);border-radius:999px;padding:4px 12px 4px 11px;font-size:13px;font-weight:500;margin:0 0 12px}
.chip svg{width:14px;height:14px}
h1{font-size:23px;font-weight:800;line-height:1.6;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 24px;font-size:15.5px;line-height:2}
label{display:block;font-size:14px;font-weight:500;margin:0 0 7px}
.field{position:relative;margin:0 0 16px}
.field>svg{position:absolute;top:50%;left:14px;width:18px;height:18px;transform:translateY(-50%);color:#9aa5b2;pointer-events:none}
input{width:100%;font:inherit;font-weight:400;font-size:16px;padding:13px 44px 13px 42px;border:1px solid #d5dbe3;border-radius:12px;background:#fbfcfd;color:var(--ink);direction:ltr;text-align:left;transition:border-color .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
#u{padding-right:14px}
input:focus{outline:none;border-color:var(--how);background:#fff;box-shadow:0 0 0 4px rgba(74,127,224,.14)}
.eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;border-radius:9px;color:#8793a1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.eye:hover{background:#f0f3f6;color:var(--ink)}
.eye svg{width:19px;height:19px}
.eye .off{display:none}.eye.on .on{display:none}.eye.on .off{display:block}
button.go{width:100%;font:inherit;font-size:16px;font-weight:700;padding:14px;margin-top:6px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s,background .15s}
button.go:hover{background:#243244;transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(24,34,46,.5)}
button.go:active{transform:none}
button.go svg{width:18px;height:18px}
button.go[disabled]{opacity:.7;cursor:wait;transform:none;box-shadow:none}
.spin{display:none;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
button.go[disabled] .spin{display:block}button.go[disabled] .arr{display:none}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#c0392b;font-size:14px;min-height:0;margin:0;text-align:center;transition:margin .15s}
.err:not(:empty){margin-top:14px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.note{display:flex;align-items:center;justify-content:center;gap:6px;color:#8793a1;font-size:12.5px;margin:18px 0 0;text-align:center;line-height:1.8}
.note svg{width:14px;height:14px;flex:none}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:13px;margin-top:20px;line-height:2}
footer b{font-weight:700;color:var(--ink)}

/* motion */
input[type=password]{font-family:Verdana,"Segoe UI",system-ui,sans-serif;font-size:15px;letter-spacing:.32em;font-weight:400}
input[type=password]::placeholder{letter-spacing:normal}
.wrap{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease;will-change:transform}
.card:before{background:linear-gradient(90deg,var(--what),var(--how),var(--why),var(--how),var(--what));background-size:300% 100%;animation:strip 8s linear infinite}
@keyframes strip{to{background-position:300% 0}}
.brand svg path,.brand svg rect{transform-box:fill-box;transform-origin:50% 100%}
.brand svg .a1{animation:wave 3.2s ease-in-out infinite}
.brand svg .a2{animation:wave 3.2s ease-in-out .18s infinite}
.brand svg .a3{animation:wave 3.2s ease-in-out .36s infinite}
@keyframes wave{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}90%{transform:scale(.97)}}
.brand:hover svg .a1,.brand:hover svg .a2,.brand:hover svg .a3{animation-duration:1s}
.chip svg{transform-origin:50% 0;transition:transform .2s}
.chip:hover svg{animation:jig .5s ease}
@keyframes jig{25%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.field input:hover:not(:focus){border-color:#b9c3cf}
.field input:focus~svg{color:var(--how)}
.field>svg{transition:color .15s,transform .2s}
.field input:focus~svg{transform:translateY(-50%) scale(1.1)}
button.go{position:relative;overflow:hidden}
button.go:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out 1.2s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
button.go .arr{transition:transform .2s}
button.go:hover .arr{transform:translateX(-5px)}
.bg svg .ring{stroke-dasharray:6 10;animation:flow 30s linear infinite}
.bg svg .ring.r2{animation-direction:reverse;animation-duration:24s}
@keyframes flow{to{stroke-dashoffset:-640}}
.bg .spark{filter:drop-shadow(0 0 4px currentColor)}
.note svg{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.75}}
footer b{display:inline-block;transition:transform .2s}
footer:hover b{transform:translateY(-2px)}
@media (max-width:420px){.card{padding:26px 20px 22px;border-radius:18px}h1{font-size:21px}}
@media (hover:none){button.go:hover{transform:none;box-shadow:none;background:var(--ink)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bg .spark{display:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 1000 520" fill="none">
<path id="r1" class="ring" d="M60 520a440 440 0 0 1 880 0" stroke="#cbe4c4" stroke-width="2"/>
<path id="r2" class="ring r2" d="M180 520a320 320 0 0 1 640 0" stroke="#c9dbf7" stroke-width="2"/>
<path id="r3" class="ring" d="M300 520a200 200 0 0 1 400 0" stroke="#f8d9bf" stroke-width="2"/>
<circle class="spark" r="4" fill="#5b9a45" color="#5b9a45"><animateMotion dur="11s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#r1"/></animateMotion></circle>
<circle class="spark" r="3.5" fill="#4a7fe0" color="#4a7fe0"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" keyPoints="1;0;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#r2"/></animateMotion></circle>
<circle class="spark" r="3" fill="#e07a2f" color="#e07a2f"><animateMotion dur="6s" begin="-1s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"><mpath href="#r3"/></animateMotion></circle>
</svg></div>
<div class="wrap">
<main class="card" id="card">
  <div class="brand"><svg aria-hidden="true" viewBox="0.5 6.4 31 19"><path class="a1" d="M3 21a13 13 0 0 1 26 0" fill="none" stroke="#5b9a45" stroke-width="2.4" stroke-linecap="round"/><path class="a2" d="M8 21a8 8 0 0 1 16 0" fill="none" stroke="#4a7fe0" stroke-width="2.4" stroke-linecap="round"/><path class="a3" d="M11.5 21a4.5 4.5 0 0 1 9 0z" fill="#e07a2f"/><rect x="1.5" y="23" width="29" height="2.2" rx="1.1" fill="#18222e"/></svg><b>کران</b><i lang="en">Karaan</i></div>
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>ویژه مشاوران کران</div>
  <h1>پنل مشاوران <span>کران</span></h1>
  <p class="lead">با نام کاربری و رمزی که برایتان فرستاده‌ایم وارد شوید. بعد از ورود، همه پیشنهادهای همکاری کران را یک‌جا می‌بینید و بینشان جابه‌جا می‌شوید.</p>
  <form id="f" autocomplete="on" novalidate>
    <label for="u">نام کاربری</label>
    <div class="field">
      <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </div>
    <label for="p">رمز عبور</label>
    <div class="field">
      <input id="p" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg>
      <button type="button" class="eye" id="eye" aria-label="نمایش رمز عبور"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
    </div>
    <button class="go" id="b" type="submit"><span class="spin" aria-hidden="true"></span><span id="bt">ورود به پنل</span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>محتوا رمزگذاری شده و فقط با رمز شما باز می‌شود.</div>
</main>
<footer><b>کران</b> · ممنون که در ساختنش کنار ما هستید</footer>
</div>

var KEY="karaan-adv-mkt-v1";
function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function t(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
var S=window.crypto&&crypto.subtle;
async function H(u){return t(new Uint8Array(await S.digest("SHA-256",new TextEncoder().encode(u))))}
async function mac(key,data){var k=await S.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]);return new Uint8Array(await S.sign("HMAC",k,data))}
function eq(a,b){if(a.length!==b.length)return false;var r=0;for(var i=0;i<a.length;i++)r|=a[i]^b[i];return r===0}
function cat(a,b){var c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c}
async function dec(key,iv,ct,m){
  if(!eq(await mac(key.slice(32),cat(iv,ct)),m))return null;

async function login(u,p){
  var e=D.u[await H(u)];if(!e)return null;
  var k=await S.importKey("raw",new TextEncoder().encode(u+":"+p),"PBKDF2",false,["deriveBits"]);

  var pt=await dec(K,b(D.i),b(D.c),b(D.m));if(!pt)return false;

  document.open();document.write(html);document.close();
  return true;
}
