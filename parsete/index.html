*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Bonyan",Tahoma,system-ui,sans-serif;background:#f4f5f7;color:#18222e;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:380px;background:#fff;border:1px solid #e2e6ec;border-radius:16px;padding:32px 26px;box-shadow:0 10px 30px rgba(24,34,46,.06)}
.brand{font-weight:700;font-size:26px;margin:0 0 4px}
.brand span{color:#667383;font-weight:400;font-size:16px;margin-right:6px}
p{color:#667383;margin:0 0 22px;font-size:15px;line-height:1.9}
label{display:block;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #d5dbe3;border-radius:10px;margin:0 0 16px;background:#fff;color:#18222e;direction:ltr;text-align:left}
input:focus{outline:none;border-color:#2f3d4f;box-shadow:0 0 0 3px #e9edf2}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:10px;background:#18222e;color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#c0392b;font-size:14px;min-height:22px;margin:12px 0 0;text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1 class="brand">کران<span>Karaan</span></h1>
  <p>این پیشنهاد محرمانه است. برای دیدن آن، نام کاربری و رمز عبور را وارد کنید.</p>
  <form id="f" autocomplete="on">
    <label for="u">نام کاربری</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="p">رمز عبور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">ورود</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</main>

var KEY="karaan-parsete";
function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function t(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
var S=window.crypto&&crypto.subtle;
async function derive(u,p){
  var k=await S.importKey("raw",new TextEncoder().encode(u+":"+p),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await S.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b(D.s),iterations:D.n},k,512));
}
async function unlock(bits){
  var mk=await S.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  var iv=b(D.i),ct=b(D.c),data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
  if(!(await S.verify("HMAC",mk,b(D.m),data)))return false;
  var ek=await S.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  var html=new TextDecoder().decode(await S.decrypt({name:"AES-CBC",iv:iv},ek,ct));
  document.open();document.write(html);document.close();
  return true;
}
var f=document.getElementById("f"),e=document.getElementById("e"),btn=document.getElementById("b");
if(!S){e.textContent="مرورگر شما از این صفحه پشتیبانی نمی‌کند. لطفاً با یک مرورگر به‌روز باز کنید.";btn.disabled=true;return}
function auto(){try{var saved=sessionStorage.getItem(KEY);if(saved){unlock(b(saved)).then(function(ok){if(!ok)sessionStorage.removeItem(KEY)},function(){sessionStorage.removeItem(KEY)})}}catch(x){}}
if(document.readyState==="complete")setTimeout(auto,0);else window.addEventListener("load",function(){setTimeout(auto,0)});
f.addEventListener("submit",async function(ev){
  ev.preventDefault();e.textContent="";btn.disabled=true;btn.textContent="در حال باز کردن…";
  try{
    var bits=await derive(document.getElementById("u").value.trim(),document.getElementById("p").value);
    try{sessionStorage.setItem(KEY,t(bits))}catch(x){}
    if(await unlock(bits))return;
    try{sessionStorage.removeItem(KEY)}catch(x){}
    e.textContent="نام کاربری یا رمز عبور درست نیست.";
  }catch(x){e.textContent="خطایی رخ داد. دوباره تلاش کنید."}
  btn.disabled=false;btn.textContent="ورود";
});
