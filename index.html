:root{--ink:#18222e;--muted:#667383;--bg:#f4f5f7;--why:#e07a2f;--how:#4a7fe0;--what:#5b9a45}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Bonyan",Tahoma,system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#eef3fa 0%,var(--bg) 62%);z-index:-1}
.sc{width:min(100vw,1200px);height:auto;max-height:100dvh;overflow:visible}
.horizon{stroke:#18222e;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2200;stroke-dashoffset:2200;animation:line 1.2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes line{to{stroke-dashoffset:0}}
.lower{opacity:0;animation:fade 1.4s ease 1.2s forwards}
.lw{fill:none;stroke:#b9c3cf;stroke-width:1.3}.lw.d{stroke-dasharray:3 9}
.base{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:base .7s cubic-bezier(.2,.8,.2,1) .9s forwards}
@keyframes base{to{transform:scaleX(1)}}
.tick{stroke:#c4ccd6;stroke-width:1.2;opacity:0;animation:fade .6s ease 1s forwards}
@keyframes fade{to{opacity:1}}
.ring{fill:none;stroke:#cdd5df;stroke-width:1.3;stroke-dasharray:1400;stroke-dashoffset:1400;animation:ring 1.6s cubic-bezier(.5,0,.2,1) .6s forwards}
.ring.d{stroke-dasharray:3 9;stroke-dashoffset:0;opacity:0;animation:fade 1.2s ease .9s forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.arc{fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s cubic-bezier(.6,0,.2,1) 1s forwards}
.arc.a2{animation-delay:1.25s}
.core{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:grow .6s cubic-bezier(.3,1.6,.5,1) 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scale(1)}}
.mark{cursor:pointer}
.mark>g{transform-box:fill-box;transform-origin:50% 100%}
.mark.live .w1{animation:wave 3.4s ease-in-out infinite}.mark.live .w2{animation:wave 3.4s ease-in-out .18s infinite}.mark.live .w3{animation:wave 3.4s ease-in-out .36s infinite}
.mark:hover>g{animation-duration:.9s!important;animation-delay:0s!important}
@keyframes wave{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.08)}90%{transform:scale(.97)}}
.ripple{fill:none;stroke:var(--how);stroke-width:1.6;opacity:0;transform-box:view-box;transform-origin:500px 430px}
.ripple.go{animation:rip 1.4s ease-out}
@keyframes rip{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.nodes{opacity:0;animation:fade .8s ease 2s forwards}
.cnode circle{fill:#fff;stroke:#d5dce5;stroke-width:1.2}
.cnode text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600}
.node.under .face.real{display:none}.node.under .face.code{display:inline}
.node .face.code rect{fill:#fff;stroke:#c3ccd7;stroke-width:1.2;stroke-dasharray:3 3}
.node .face.code text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600}
.node.under{cursor:default}
.node.under .pop{transform:none!important}
.node{cursor:pointer}
.nodes{opacity:0;animation:fade .8s ease 2s forwards}
.node circle{fill:#fff;stroke:#e2e6ec;stroke-width:1.2;transition:fill .25s,stroke .25s}
.node .ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.node .pop{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.node:hover .pop,.node.on .pop{transform:scale(1.35) rotate(-10deg)}
.node.g:hover circle,.node.g.on circle{fill:var(--what);stroke:var(--what)}
.node.b:hover circle,.node.b.on circle{fill:var(--how);stroke:var(--how)}
.node.o:hover circle,.node.o.on circle{fill:var(--why);stroke:var(--why)}
.node:hover .ic,.node.on .ic{stroke:#fff}
.t1{font-weight:800;font-size:38px;fill:var(--ink);opacity:0;animation:fade .8s ease 1.9s forwards}
.t2{font-size:19px;fill:var(--muted);opacity:0;animation:fade .8s ease 2.2s forwards,soft 2.4s ease-in-out 3s infinite}
@keyframes soft{0%,100%{opacity:1}50%{opacity:.3}}
.live-dot{fill:var(--what);opacity:0;animation:fade .8s ease 2.2s forwards,blink 1.8s ease-in-out 3s infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:640px){.sc{width:100vw}.live-dot{display:none}.t1{font-size:58px}.t2{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.horizon,.ring,.arc{stroke-dashoffset:0}.ring.d,.tick,.node,.t1,.t2,.live-dot{opacity:1}.core,.base{transform:none}.lower{opacity:1}}
</style>

<script>
(function(){
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

var CX=500,HY=430,R=[150,215,280,345,410],T=[28,38,48,58,68];
var ns=[].slice.call(document.querySelectorAll(".node")),cs={};
[].forEach.call(document.querySelectorAll(".cnode"),function(c){cs[c.getAttribute("data-i")]=c});
var per={};ns.forEach(function(n){var r=+n.getAttribute("data-r");per[r]=(per[r]||0)+1});
var cnt={};ns.forEach(function(n){var r=+n.getAttribute("data-r"),k=cnt[r]=(cnt[r]||0)+1;n._r=r;n._ph=(k-1)/per[r]+r*.11;n._c=cs[n.getAttribute("data-i")]});
function place(t){ns.forEach(function(n){var r=R[n._r],a=Math.PI-2*Math.PI*((t/T[n._r]+n._ph)%1),x=CX+r*Math.cos(a),y=HY-r*Math.sin(a),d=y-HY,tr="translate("+x.toFixed(1)+" "+y.toFixed(1)+")";
  n.setAttribute("transform",tr);n._c.setAttribute("transform",tr);
  var o=1;if(d>0){o=Math.max(.35,1-d/380);var ax=Math.abs(x-CX);if(ax<150&&d<165)o*=Math.min(1,Math.max(.06,(ax-95)/55))}
  n._c.style.opacity=o.toFixed(2)})}
var t0=performance.now();
function loop(now){place((now-t0)/1000+6);requestAnimationFrame(loop)}
if(reduce)place(6);else requestAnimationFrame(loop);
var mark=document.getElementById("mark"),rip=document.getElementById("rip");
setTimeout(function(){mark.classList.add("live")},2400);
var sv=document.querySelector(".sc");function fit(){sv.setAttribute("viewBox",innerWidth<640?"230 70 540 640":"0 30 1000 680")}fit();addEventListener("resize",fit);
function ripple(){rip.classList.remove("go");void rip.getBoundingClientRect();rip.classList.add("go")}
mark.addEventListener("mouseenter",ripple);mark.addEventListener("click",ripple);
if(!reduce){setTimeout(ripple,2300);setInterval(ripple,6500)}
if(reduce){var s=document.querySelector("svg");s.pauseAnimations&&s.pauseAnimations()}
[].forEach.call(document.querySelectorAll(".node"),function(n){n.addEventListener("click",function(){n.classList.add("on");clearTimeout(n._t);n._t=setTimeout(function(){n.classList.remove("on")},1200)})});
})();
</script>
