:root{--ink:#18222e;--muted:#667383;--line:#e2e6ec;--bg:#f4f5f7;--why:#e07a2f;--how:#4a7fe0;--what:#5b9a45;--why-bg:#fdf0e6;--how-bg:#eaf2fb;--what-bg:#e8f3ea}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bonyan",Tahoma,system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden;display:flex;flex-direction:column}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:center;max-width:1120px;width:100%;margin:0 auto;padding:22px 22px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:default}
.brand svg{width:44px;height:27px}
.brand b{font-weight:800;font-size:26px;line-height:1}
.brand i{font-style:normal;color:var(--muted);font-size:14px;letter-spacing:.06em;margin-top:4px}
.brand svg path{transform-box:fill-box;transform-origin:50% 100%}
.brand .a1{animation:wave 3.2s ease-in-out infinite}.brand .a2{animation:wave 3.2s ease-in-out .18s infinite}.brand .a3{animation:wave 3.2s ease-in-out .36s infinite}
.brand:hover .a1,.brand:hover .a2,.brand:hover .a3{animation-duration:.9s}
@keyframes wave{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.14)}90%{transform:scale(.96)}}
.soon{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;box-shadow:0 4px 14px -8px rgba(24,34,46,.25)}
.soon .dot{width:8px;height:8px;border-radius:50%;background:var(--what);box-shadow:0 0 0 0 rgba(91,154,69,.5);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(91,154,69,0)}100%{box-shadow:0 0 0 0 rgba(91,154,69,0)}}
main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:10px 22px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kicker{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 16px}
.kicker span{font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;transition:transform .2s}
.kicker span:hover{transform:translateY(-3px) rotate(-2deg)}
.k1{background:var(--why-bg);color:var(--why)}.k2{background:var(--how-bg);color:var(--how)}.k3{background:var(--what-bg);color:var(--what)}
h1{font-weight:800;font-size:clamp(28px,5vw,50px);line-height:1.55;margin:0;max-width:820px}
h1 .hl{position:relative;white-space:nowrap;color:var(--how)}
h1 .hl svg{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:12px;overflow:visible}
h1 .hl path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.2s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{color:var(--muted);font-size:clamp(16px,2.2vw,19px);line-height:2;max-width:640px;margin:14px 0 0}
.scene{width:100%;max-width:980px;margin:0;position:relative}
.scene svg{width:100%;height:auto;display:block;overflow:visible}
.tip{font-size:13px;color:#8793a1;margin:4px 0 0;display:flex;align-items:center;gap:6px;justify-content:center}
.tip svg{width:16px;height:16px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-3px,-3px)}}
/* scene parts */
.s *{transform-box:fill-box}
.cloud{animation:drift 38s linear infinite}.cloud.c2{animation-duration:52s;animation-delay:-20s}.cloud.c3{animation-duration:45s;animation-delay:-35s}
@keyframes drift{from{transform:translateX(1050px)}to{transform:translateX(-260px)}}
.gear{transform-origin:center;animation:spin 7s linear infinite}.gear.g2{animation-direction:reverse;animation-duration:4.9s}
@keyframes spin{to{transform:rotate(360deg)}}
.gears:hover .gear{animation-duration:1.2s}.gears:hover .gear.g2{animation-duration:.85s}
.gears{cursor:pointer}
.puff{transform-origin:center;animation:puff 4s ease-out infinite;opacity:0}
.puff.p2{animation-delay:1.3s}.puff.p3{animation-delay:2.6s}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.85}100%{transform:translate(-26px,-70px) scale(1.5);opacity:0}}
.belt-top{stroke-dasharray:14 10;animation:belt 1s linear infinite}
@keyframes belt{to{stroke-dashoffset:24}}
.roller{transform-origin:center;animation:spin 1.1s linear infinite reverse}
.box{animation:carry 9s linear infinite}
.box.b2{animation-delay:-3s}.box.b3{animation-delay:-6s}
@keyframes carry{0%{transform:translateX(0);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(-420px);opacity:0}}
.arm{transform-origin:50% 0;animation:sort 1.5s ease-in-out infinite}
.arm.r{animation-delay:-.75s}
@keyframes sort{50%{transform:rotate(-24deg)}}
.bot{cursor:pointer}
.bot .body{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.bot:hover .body,.bot.on .body{transform:translateY(-14px)}
.bot .ant{animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{fill:#fff}}
.bot .say{opacity:0;transform:translateY(6px) scale(.9);transition:.25s;transform-origin:50% 100%}
.bot:hover .say,.bot.on .say{opacity:1;transform:none}
.bot .mouth{transition:d .2s}
.bob{animation:bob 2.4s ease-in-out infinite}.bob.d{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-3px)}}
.human{cursor:pointer}
.bulb{transition:fill .3s,filter .3s}
.human .rays{opacity:0;transition:opacity .3s}
.think{animation:think 5s ease-in-out infinite}
@keyframes think{0%,60%,100%{fill:#f2f4f7}70%,90%{fill:#ffd36b}}
.human:hover .bulb,.human.on .bulb{fill:#ffd36b;filter:drop-shadow(0 0 8px #ffd36b)}
.human:hover .rays,.human.on .rays{opacity:1}
.bubble{transform-origin:0 100%;animation:pop 5s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.dots circle{animation:dot 1.4s infinite}.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-3px);opacity:.4}}
.arrester{cursor:pointer}
.bolt{opacity:0}
.arrester:hover .bolt,.arrester.on .bolt{animation:strike .9s ease-out}
.spark{opacity:0;transform-origin:center}
.arrester:hover .spark,.arrester.on .spark{animation:sp .9s ease-out .25s}
.auto .bolt{animation:strike .9s ease-out}
.auto .spark{animation:sp .9s ease-out .25s}
@keyframes strike{0%,100%{opacity:0}10%,30%{opacity:1}20%{opacity:.3}}
@keyframes sp{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.2)}}
.chip{animation:float 6s ease-in-out infinite;cursor:default}
.chip.c2{animation-delay:-2s}.chip.c3{animation-delay:-4s}
.chip rect{transition:fill .2s}
.chip:hover rect{fill:#18222e}.chip:hover text{fill:#fff}
@keyframes float{50%{transform:translateY(-8px)}}
.bird{animation:fly 22s linear infinite}
@keyframes fly{0%{transform:translate(-80px,40px)}100%{transform:translate(1050px,-10px)}}
.wing{transform-origin:50% 100%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.6)}}
.progress{width:min(360px,80%);height:8px;border-radius:99px;background:#e3e8ee;overflow:hidden;margin:22px auto 0;position:relative}
.progress i{position:absolute;inset:0;width:72%;border-radius:99px;background:linear-gradient(90deg,var(--what),var(--how),var(--why));background-size:200% 100%;animation:bar 3s linear infinite}
.progress i:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px);animation:stripes 1s linear infinite}
@keyframes bar{to{background-position:200% 0}}
@keyframes stripes{to{background-position:22px 0}}
.cta{margin:14px 0 0;font-size:clamp(20px,3vw,26px);font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center}
.cta .rk{display:inline-block;animation:rocket 2.2s ease-in-out infinite}
@keyframes rocket{50%{transform:translateY(-6px) rotate(-8deg)}}
.cta:hover .rk{animation:launch .9s ease-in forwards}
@keyframes launch{to{transform:translate(-40px,-60px) rotate(-20deg);opacity:0}}
.mini{color:var(--muted);font-size:14px;margin:8px 0 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
footer b{color:var(--ink)}
@media (max-width:640px){.top{padding:16px 16px 0}.soon{font-size:12.5px;padding:5px 11px}main{padding:22px 16px 6px}.tip{display:none}}

</style>
</head>
<body>

<main>

    </defs>
    <rect x="0" y="0" width="960" height="330" rx="28" fill="url(#sky)"/>

      <circle class="puff p2" cx="161" cy="-34" r="9" fill="#e6ebf1"/>
      <circle class="puff p3" cx="161" cy="-34" r="9" fill="#e6ebf1"/>
      <g fill="#fff" opacity=".9"><rect x="18" y="100" width="24" height="18" rx="3"/><rect x="58" y="100" width="24" height="18" rx="3"/><rect x="98" y="100" width="24" height="18" rx="3"/><rect x="138" y="100" width="24" height="18" rx="3"/></g>
      <rect x="66" y="138" width="40" height="42" rx="4" fill="#c4ceda"/>

        <line x1="40" y1="52" x2="40" y2="16" stroke="#8b97a5" stroke-width="3"/>
        <g fill="#b6c1cd"><ellipse cx="40" cy="44" rx="8" ry="3"/><ellipse cx="40" cy="36" rx="8" ry="3"/><ellipse cx="40" cy="28" rx="8" ry="3"/></g>
        <circle cx="40" cy="14" r="3.5" fill="#e07a2f"/>
        <path class="bolt" d="M70 -120 L48 -60 L62 -60 L40 12" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle class="spark" cx="40" cy="14" r="10" fill="none" stroke="#ffc94a" stroke-width="3"/>
      </g>
    </g>

    <!-- gears -->
    <g class="gears" transform="translate(250 60)">
      <g class="gear"><path d="M30 6l4 0 1 6 5 2 5-4 3 3-4 5 2 5 6 1 0 4-6 1-2 5 4 5-3 3-5-4-5 2-1 6-4 0-1-6-5-2-5 4-3-3 4-5-2-5-6-1 0-4 6-1 2-5-4-5 3-3 5 4 5-2z" fill="#c9dbf7" transform="translate(-2 -2)"/><circle cx="30" cy="30" r="7" fill="#f4f5f7"/></g>
      <g transform="translate(40 30)"><g class="gear g2"><path d="M20 4l3 0 1 4 4 2 3-3 2 2-3 3 2 4 4 1 0 3-4 1-2 4 3 3-2 2-3-3-4 2-1 4-3 0-1-4-4-2-3 3-2-2 3-3-2-4-4-1 0-3 4-1 2-4-3-3 2-2 3 3 4-2z" fill="#f8d9bf"/><circle cx="21.5" cy="21.5" r="5" fill="#f4f5f7"/></g></g>
    </g>

    <!-- ground -->
    <rect x="0" y="330" width="960" height="3" rx="1.5" fill="#d5dbe3"/>

    <!-- conveyor -->

      <rect x="40" y="30" width="8" height="30" fill="#c4ceda"/><rect x="412" y="30" width="8" height="30" fill="#c4ceda"/>
      <!-- boxes -->
      <g class="box"><g transform="translate(430 -16)"><rect width="30" height="26" rx="4" fill="#f8d9bf"/><path d="M6 8h18M6 14h12M6 20h15" stroke="#e07a2f" stroke-width="2" stroke-linecap="round"/></g></g>
      <g class="box b2"><g transform="translate(430 -16)"><rect width="30" height="26" rx="4" fill="#c9dbf7"/><path d="M6 8h18M6 14h12M6 20h15" stroke="#4a7fe0" stroke-width="2" stroke-linecap="round"/></g></g>
      <g class="box b3"><g transform="translate(430 -16)"><rect width="30" height="26" rx="4" fill="#cbe4c4"/><path d="M6 8h18M6 14h12M6 20h15" stroke="#5b9a45" stroke-width="2" stroke-linecap="round"/></g></g>
    </g>

    <!-- bots -->
    <g class="bot" id="bot1" transform="translate(370 180)">
      <g class="bob"><g class="body">
        <g class="say"><rect x="-30" y="-46" width="104" height="30" rx="12" fill="#18222e"/><path d="M14 -16 l6 7 l6 -7z" fill="#18222e"/><text x="22" y="-26" text-anchor="middle" font-size="13" fill="#fff">انجامش دادم!</text></g>
        <line x1="22" y1="0" x2="22" y2="-10" stroke="#8b97a5" stroke-width="3"/><circle class="ant" cx="22" cy="-12" r="4" fill="#5b9a45"/>
        <rect x="0" y="0" width="44" height="34" rx="12" fill="#fff" stroke="#4a7fe0" stroke-width="3"/>
        <g class="eyes"><circle cx="14" cy="16" r="4.5" fill="#18222e"/><circle cx="30" cy="16" r="4.5" fill="#18222e"/></g>
        <path class="mouth" d="M15 25 q7 5 14 0" stroke="#4a7fe0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <rect x="4" y="38" width="36" height="40" rx="10" fill="#4a7fe0"/>
        <rect x="14" y="48" width="16" height="10" rx="3" fill="#c9dbf7"/>
        <rect class="arm" x="-6" y="42" width="9" height="30" rx="4.5" fill="#3a6bc4"/>
        <rect class="arm r" x="41" y="42" width="9" height="30" rx="4.5" fill="#3a6bc4"/>
      </g></g>
    </g>
    <g class="bot" id="bot2" transform="translate(540 180)">
      <g class="bob d"><g class="body">
        <g class="say"><rect x="-34" y="-46" width="112" height="30" rx="12" fill="#18222e"/><path d="M14 -16 l6 7 l6 -7z" fill="#18222e"/><text x="22" y="-26" text-anchor="middle" font-size="13" fill="#fff">برای تأیید آماده‌ست</text></g>
        <line x1="22" y1="0" x2="22" y2="-10" stroke="#8b97a5" stroke-width="3"/><circle class="ant" cx="22" cy="-12" r="4" fill="#e07a2f"/>
        <rect x="0" y="0" width="44" height="34" rx="12" fill="#fff" stroke="#5b9a45" stroke-width="3"/>
        <g class="eyes"><circle cx="14" cy="16" r="4.5" fill="#18222e"/><circle cx="30" cy="16" r="4.5" fill="#18222e"/></g>
        <path class="mouth" d="M15 25 q7 5 14 0" stroke="#5b9a45" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <rect x="4" y="38" width="36" height="40" rx="10" fill="#5b9a45"/>
        <rect x="14" y="48" width="16" height="10" rx="3" fill="#cbe4c4"/>
        <rect class="arm" x="-6" y="42" width="9" height="30" rx="4.5" fill="#4a8538"/>
        <rect class="arm r" x="41" y="42" width="9" height="30" rx="4.5" fill="#4a8538"/>
      </g></g>
    </g>

    <!-- human at desk -->
    <g class="human" id="human" transform="translate(760 170)">
      <rect x="-20" y="-120" width="190" height="290" fill="transparent"/>
      <g class="bubble"><g transform="translate(70 -110)">
        <circle cx="-30" cy="96" r="5" fill="#fff" stroke="#e2e6ec"/><circle cx="-18" cy="82" r="8" fill="#fff" stroke="#e2e6ec"/>
        <rect x="-10" y="0" width="110" height="70" rx="30" fill="#fff" stroke="#e2e6ec"/>
        <g transform="translate(45 35)">
          <g class="rays" stroke="#ffc94a" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-26" x2="0" y2="-20"/><line x1="18" y1="-18" x2="14" y2="-14"/><line x1="-18" y1="-18" x2="-14" y2="-14"/><line x1="24" y1="0" x2="19" y2="0"/><line x1="-24" y1="0" x2="-19" y2="0"/></g>
          <circle class="bulb think" cx="0" cy="-2" r="13" fill="#f2f4f7" stroke="#18222e" stroke-width="2"/>
          <rect x="-6" y="11" width="12" height="7" rx="2" fill="#18222e"/>
        </g>
      </g></g>
      <!-- person -->
      <circle cx="40" cy="44" r="18" fill="#f1c9a5"/>
      <path d="M22 40 q18 -26 36 0 q-4 -16 -18 -16 q-14 0 -18 16z" fill="#2f3d4f"/>
      <path d="M14 112 q0 -44 26 -44 q26 0 26 44z" fill="#e07a2f"/>
      <!-- desk -->
      <rect x="-10" y="110" width="150" height="10" rx="5" fill="#2f3d4f"/>
      <rect x="0" y="120" width="8" height="40" fill="#c4ceda"/><rect x="122" y="120" width="8" height="40" fill="#c4ceda"/>

      <!-- mug -->
      <rect x="0" y="94" width="14" height="16" rx="3" fill="#5b9a45"/><path d="M14 98 q7 0 7 5 q0 5 -7 5" stroke="#5b9a45" stroke-width="2" fill="none"/>
    </g>
  </svg>
  </div>

  <div class="progress" aria-hidden="true"><i></i></div>
  <p class="cta">به‌زودی می‌آییم بالا! <span class="rk" aria-hidden="true">🚀</span></p>
</main>

<script>
(function(){
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
var svg=document.querySelector(".scene svg");
var eyes=[].slice.call(document.querySelectorAll(".bot .eyes"));
function look(cx,cy){eyes.forEach(function(g){var r=g.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=cx-x,dy=cy-y,d=Math.hypot(dx,dy)||1,m=Math.min(2.6,d/40);g.setAttribute("transform","translate("+(dx/d*m).toFixed(2)+" "+(dy/d*m).toFixed(2)+")")})}
if(!reduce)window.addEventListener("pointermove",function(e){look(e.clientX,e.clientY)},{passive:true});
// tap toggles on touch
["bot1","bot2","human","arr"].forEach(function(id){var el=document.getElementById(id);el.addEventListener("click",function(){el.classList.remove("on");void el.getBoundingClientRect();el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("on")},1800)})});
// occasional automatic lightning
var arr=document.getElementById("arr");
if(!reduce)setInterval(function(){arr.classList.remove("auto");void arr.getBoundingClientRect();arr.classList.add("auto")},7000);
})();
</script>
</body>
</html>
